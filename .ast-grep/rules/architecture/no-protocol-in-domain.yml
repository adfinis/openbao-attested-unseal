# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-protocol-in-domain
message: Domain packages must not depend on generated protocol types.
severity: error
language: Go
files:
  - internal/nodeevidence/**/*.go
  - internal/keyring/**/*.go
  - internal/keyprotection/**/*.go
  - internal/tpm/**/*.go
  - internal/enrollment/**/*.go
  - internal/recovery/**/*.go
rule:
  all:
    - kind: import_spec
    - regex: '"github\.com/adfinis/openbao-attested-unseal/internal/protocol(?:/[^"]*)?"'
note: Map protobuf messages into domain types at the transport boundary.
